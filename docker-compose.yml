services:
  gateway:
    image: nginx:stable-alpine
    container_name: hyper-clock-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [watch-face, back-stage]
    networks: [hyper-clock]

  watch-face:
    build:
      context: .
      dockerfile: watch-face/Dockerfile
    container_name: hyper-clock-watch-face
    restart: unless-stopped
    environment:
      CONTROL_PLANE_URL: http://back-stage:3001
      NEXT_PUBLIC_CONTROL_PLANE_URL: ""
      KIOSK_SHARED_SECRET: ${KIOSK_SHARED_SECRET}
    expose: ["3000"]
    depends_on: [back-stage]
    networks: [hyper-clock]

  back-stage:
    build:
      context: .
      dockerfile: back-stage/Dockerfile
    container_name: hyper-clock-back-stage
    restart: unless-stopped
    env_file: ./back-stage/.env
    environment:
      TRUST_PROXY_HEADERS: "true"
      COOKIE_SECURE: "false"
      WATCH_FACE_ORIGIN: http://127.0.0.1:8080
      KIOSK_SHARED_SECRET: ${KIOSK_SHARED_SECRET}
    volumes:
      - ./back-stage/data:/app/back-stage/data
      - /opt/hyper-clock/bin:/opt/hyper-clock/bin:ro
    expose: ["3001"]
    depends_on: [homeassistant]
    networks: [hyper-clock]

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
    expose: ["8123"]
    networks: [hyper-clock]

networks:
  hyper-clock:
    driver: bridge
