[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "q775-sensor-daemon"
version = "0.2.0"
description = "Q775 sidecar: curated telemetry, screen control, sleep/wake and camera bridge for Home Assistant"
requires-python = ">=3.12"
dependencies = [
  "aiohttp==3.14.3",
  "psutil==7.2.2",
]

[project.optional-dependencies]
# Only needed with [collectors].enable_udev = true.
udev = ["pyudev==0.24.4; sys_platform == 'linux'"]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.13.2"]

[project.scripts]
q775-daemon = "q775_daemon.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
